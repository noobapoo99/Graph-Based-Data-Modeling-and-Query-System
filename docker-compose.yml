# LOCAL DEVELOPMENT ONLY
# For production deployment, see render.yaml.
# Uses local Neo4j + Redis instead of Aura + Upstash.
services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p password123 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      REDIS_URL: redis://redis:6379
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATA_DIR: /workspace/data
      SAP_DATA_DIR: /workspace/sap-o2c-data
      ALLOWED_ORIGINS: http://localhost:5173
      INGEST_TOKEN: local-ingest-token
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/workspace/data:ro
      - ./sap-o2c-data:/workspace/sap-o2c-data:ro

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
